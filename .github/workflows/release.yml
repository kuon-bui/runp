name: Release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Tagged commit is not reachable from main: $tag_commit" >&2
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read -r os arch <<< "$target"
            rm -rf build
            mkdir build

            binary=runp
            if [[ "$os" == windows ]]; then
              binary=runp.exe
            fi

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "build/$binary" .

            if [[ "$os" == windows ]]; then
              (cd build && zip -q "../dist/runp-$os-$arch.zip" "$binary")
            else
              (cd build && tar -czf "../dist/runp-$os-$arch.tar.gz" "$binary")
            fi
          done
          (cd dist && sha256sum runp-* > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
